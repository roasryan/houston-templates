<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Check a code · Magnolia &amp; Mesquite Kitchen</title><meta name="robots" content="noindex,nofollow"><meta name="description" content="Check a code at Magnolia &amp; Mesquite Kitchen.">
<link rel="stylesheet" href="assets/site.css"><style>
.qo{max-width:560px;margin:0 auto;padding:calc(var(--bh,64px) + 18px) 16px 60px}
.qo .card{background:#fff;color:var(--ink);border-radius:20px;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.18);margin-top:14px}
.qo h1{font-size:clamp(32px,8vw,46px);line-height:1.05;margin:6px 0 10px}
.qo .lede{font-size:18px;margin:0 0 6px}.qo .fine{font-size:14px;color:var(--soft)}
.qo label{display:block;font-weight:700;margin:14px 0 6px}.qo input[type=text],.qo input[type=tel],.qo input[type=email]{width:100%;box-sizing:border-box;min-height:52px;font-size:18px;padding:0 14px;border:2px solid #D5DEE3;border-radius:12px}
.qo .ck{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;margin:14px 0 0;font-size:14px;line-height:1.45;color:var(--soft);font-weight:400}
.qo .ck input{width:22px;height:22px;margin:2px 0 0}
.qo .go{width:100%;min-height:58px;font-size:20px;margin-top:18px}
.qo .err{color:#B3261E;font-weight:700;margin:12px 0 0}
.qo .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.qcode{font:900 44px/1 var(--display);letter-spacing:.08em;text-align:center;background:var(--concrete,#F2F5F7);border-radius:16px;padding:18px 10px;margin:12px 0}
.qst{display:inline-block;font:800 14px/1 var(--body);text-transform:uppercase;letter-spacing:.06em;padding:8px 12px;border-radius:999px}
.qst.valid{background:#DFF3E7;color:#14532D}.qst.used{background:#FDE3DC;color:#8A1C10}.qst.expired{background:#EEF2F4;color:#55636E}
.qdates{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.qdates div{background:var(--concrete,#F2F5F7);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--soft)}.qdates b{display:block;color:var(--ink);font-size:16px}
.qqr{display:flex;justify-content:center;margin:8px 0}.qqr svg{width:150px;height:150px}
.qrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.qrow .btn{flex:1 1 160px;justify-content:center}
.qstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.qstats div{background:var(--concrete,#F2F5F7);border-radius:12px;padding:10px;text-align:center;font-size:13px;color:var(--soft)}.qstats b{display:block;font-size:26px;color:var(--ink)}
.qlist{list-style:none;margin:10px 0 0;padding:0;max-height:340px;overflow:auto}.qlist li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #E5EAEE;font-size:15px}.qlist li span{color:var(--soft);font-size:13px;display:block}
.qo textarea{width:100%;box-sizing:border-box;min-height:110px;font:inherit;font-size:17px;padding:12px;border:2px solid #D5DEE3;border-radius:12px}
.qtabs{display:flex;gap:8px;margin:6px 0}.qtabs button{flex:1;min-height:46px;border-radius:12px;border:2px solid #D5DEE3;background:#fff;font:800 16px var(--body);cursor:pointer}.qtabs button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.qideas{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.qideas button{border:1.5px solid #D5DEE3;background:#fff;border-radius:999px;padding:8px 12px;font:700 14px var(--body);cursor:pointer}
.qo>h1,.qo>.lede,.qo>.fine{color:#F4F7F8}.qo>.ikick{color:var(--hivis)}
.qnote{color:#4A3B00;background:#FFF6CC;border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0 0}
.tent{display:none}
@media print{body>*:not(.tent){display:none!important}.tent{display:flex!important;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:Georgia,serif;padding:40px;color:#111}.tent h2{font-size:40px;margin:0 0 10px}.tent p{font-size:20px;margin:6px 0}.tent svg{width:320px;height:320px;margin:20px 0}}
</style></head><body>
<header class="bar solid" id="bar"><div class="bar1"><a class="logo" href="index.html">Magnolia &amp; Mesquite Kitchen</a></div></header>
<main class="qo"><p class="ikick">Staff</p><h1>Check a code</h1><p class="lede">Type the 6 letters on the guest's phone, or scan their code.</p>
<div class="card"><form id="rForm"><div id="rPinRow"><label for="rPin">Staff PIN</label><input id="rPin" type="tel" inputmode="numeric" autocomplete="off"></div>
<label for="rCode">Code</label><input id="rCode" type="text" autocapitalize="characters" autocomplete="off" placeholder="ABC-123" style="font-size:28px;letter-spacing:.1em;text-align:center">
<div class="qrow"><button class="btn btn-main" type="submit">Check code</button><button class="btn btn-line" type="button" id="rScan" hidden>Scan code</button></div>
<video id="rVid" playsinline muted hidden style="width:100%;border-radius:12px;margin-top:10px"></video></form>
<div id="rOut" hidden style="margin-top:16px"></div><p class="qnote">Demo: staff PIN is 1234.</p></div></main>
<script src="assets/qrcode.js"></script><script>
const $=s=>document.querySelector(s);const BACKEND="",BIZ="Magnolia & Mesquite Kitchen",OFFER={"name": "Free appetizer", "days": 14, "url": "https://roasryan.github.io/houston-templates/restaurant/offer.html?src=table"},PFX="krestaur";
const post=o=>fetch(BACKEND,{method:'POST',body:JSON.stringify(o)}).then(r=>r.json());
const day=d=>new Date(d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
/* demo mode: same rules as offers.gs, kept in this browser */
const DB={get(){try{return JSON.parse(localStorage.getItem(PFX+'-offers')||'[]')}catch(x){return[]}},set(a){try{localStorage.setItem(PFX+'-offers',JSON.stringify(a))}catch(x){}}};
const emailKey=e=>{e=String(e||'').trim().toLowerCase();const at=e.lastIndexOf('@');if(at<1)return'';let u=e.slice(0,at),d=e.slice(at+1);if(d==='googlemail.com')d='gmail.com';u=u.split('+')[0];if(d==='gmail.com')u=u.replace(/\./g,'');return u+'@'+d};
const phoneKey=p=>String(p||'').replace(/\D/g,'').slice(-10);
const ABC='ACDEFGHJKLMNPQRTUVWXY34679';const newCode=()=>{let c='';for(let i=0;i<6;i++)c+=ABC[Math.floor(Math.random()*ABC.length)];return c.slice(0,3)+'-'+c.slice(3)};
const normCode=c=>{c=String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');return c.length===6?c.slice(0,3)+'-'+c.slice(3):''};
const view=x=>({ok:true,status:x.status==='redeemed'?'used':(x.exp<Date.now()?'expired':'valid'),code:x.code,first:x.name.split(' ')[0],offer:x.offer,claimed:day(x.t),expires:day(x.exp),redeemed:x.red?new Date(x.red).toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):''});
const DISPOSABLE=['mailinator.com','guerrillamail.com','10minutemail.com','tempmail.com','temp-mail.org','yopmail.com','trashmail.com','sharklasers.com','getnada.com','maildrop.cc'];
const local={
 offer_claim(L){const pk=phoneKey(L.phone),ek=emailKey(L.email);if(L.hp||(L.ms&&L.ms<3000))return{ok:false,reason:'try_again'};if(String(L.name||'').trim().length<2)return{ok:false,reason:'name'};
  if(pk.length!==10||/^(\d)\1{9}$/.test(pk))return{ok:false,reason:'phone'};if(!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(L.email||''))return{ok:false,reason:'email'};if(DISPOSABLE.includes(ek.split('@')[1]))return{ok:false,reason:'disposable'};
  const a=DB.get();const d=a.find(x=>x.pk===pk||x.ek===ek);if(d)return{ok:false,reason:'dup',how:d.pk===pk?'phone':'email',claimed:day(d.t)};
  let code;do code=newCode();while(a.some(x=>x.code===code));const t=Date.now(),x={t,code,name:String(L.name).trim(),phone:pk,email:String(L.email).trim(),ek,pk,sms:!!L.smsOk,mail:!!L.emailOk,status:'issued',exp:t+OFFER.days*864e5,offer:OFFER.name};a.push(x);DB.set(a);
  return{ok:true,code,first:x.name.split(' ')[0],claimed:day(t),expires:day(x.exp),texted:false,emailed:false,offer:OFFER.name,demo:true}},
 offer_status(L){const c=normCode(L.c),x=DB.get().find(y=>y.code===c);return x?view(x):{ok:false,reason:'not_found'}},
 offer_redeem(L){if(String(L.staff_pin||'')!=='1234')return{ok:false,reason:'auth'};const a=DB.get(),c=normCode(L.c),x=a.find(y=>y.code===c);if(!x)return{ok:false,reason:'not_found'};const v=view(x);if(v.status!=='valid')return Object.assign(v,{ok:false,reason:v.status});x.status='redeemed';x.red=Date.now();DB.set(a);return Object.assign(view(x),{ok:true,done:true})},
 offers_list(){const a=DB.get(),now=Date.now(),s={total:a.length,redeemed:0,active:0,expired:0,sms:0,email:0,week:0};a.forEach(x=>{if(x.status==='redeemed')s.redeemed++;else if(x.exp<now)s.expired++;else s.active++;if(x.sms)s.sms++;if(x.mail)s.email++;if(now-x.t<7*864e5)s.week++});
  return{ok:true,stats:s,recent:a.slice(-50).reverse().map(x=>({t:x.t,code:x.code,name:x.name,phone:x.phone,email:x.email,sms:x.sms,mail:x.mail,status:view(x).status})),quiet:'',demo:true}},
 broadcast(L){const a=DB.get().filter(x=>L.channel==='sms'?x.sms:x.mail);return{ok:true,sent:L.test?1:a.length,failed:0,stopped:0,total:L.test?1:a.length,demo:true}}};
const call=o=>BACKEND?post(o).catch(()=>({ok:false,reason:'net'})):Promise.resolve(local[o.action](o));
function qrSvg(t){try{const q=qrcode(0,'M');q.addData(t);q.make();return q.createSvgTag({cellSize:4,margin:2,scalable:true})}catch(x){return''}}

let PIN=sessionStorage.getItem(PFX+'-staffpin')||'',TOK=localStorage.getItem(PFX+'-otok')||'';
const fmtC=v=>{v=v.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);return v.length>3?v.slice(0,3)+'-'+v.slice(3):v};
$('#rCode').addEventListener('input',e=>{e.target.value=fmtC(e.target.value)});
function show(r){const b=$('#rOut');b.hidden=false;if(!r.ok&&!r.status){b.innerHTML=`<p class="err">${({not_found:'No code like that. Check the letters.',auth:'Wrong staff PIN.',locked:'Too many tries. Wait 15 minutes.',net:'No connection.'})[r.reason]||'Try again.'}</p>`;if(r.reason==='auth'){PIN='';sessionStorage.removeItem(PFX+'-staffpin');$('#rPinRow').hidden=false}return}
 const big=r.done?'MARKED AS USED':{valid:'VALID',used:'ALREADY USED',expired:'EXPIRED'}[r.status];
 b.innerHTML=`<p style="text-align:center"><span class="qst ${r.status}" style="font-size:22px;padding:12px 18px">${big}</span></p><div class="qcode">${r.code}</div>
 <p class="lede" style="text-align:center"><b>${r.first}</b> · ${r.offer}</p><div class="qdates"><div>Claimed<b>${r.claimed}</b></div><div>Good until<b>${r.expires}</b></div></div>
 ${r.redeemed?`<p class="fine" style="text-align:center">Used ${r.redeemed}</p>`:''}
 ${r.status==='valid'&&!r.done?'<button class="btn btn-main go" type="button" id="rUse">Mark as used</button>':''}${r.done?'<p class="lede" style="text-align:center;color:#14532D"><b>Done. Enjoy!</b></p>':''}`;
 const u=$('#rUse');if(u)u.onclick=()=>{u.disabled=true;call({action:'offer_redeem',c:r.code,staff_pin:PIN,token:TOK,by:'staff'}).then(show)}}
$('#rForm').addEventListener('submit',ev=>{ev.preventDefault();if($('#rPin').value)PIN=$('#rPin').value.trim();if(!PIN&&!TOK){$('#rPinRow').hidden=false;$('#rPin').focus();return}sessionStorage.setItem(PFX+'-staffpin',PIN);if(PIN)$('#rPinRow').hidden=true;
 call({action:'offer_status',c:$('#rCode').value}).then(show)});
if(PIN||TOK)$('#rPinRow').hidden=true;
if('BarcodeDetector' in window){const sb=$('#rScan');sb.hidden=false;sb.onclick=async()=>{try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=$('#rVid');v.hidden=false;v.srcObject=st;await v.play();const det=new BarcodeDetector({formats:['qr_code']});
 const tick=async()=>{const f=await det.detect(v).catch(()=>[]);if(f[0]){st.getTracks().forEach(t=>t.stop());v.hidden=true;$('#rCode').value=fmtC(f[0].rawValue);$('#rForm').requestSubmit();return}requestAnimationFrame(tick)};tick()}catch(x){}}}
</script></body></html>
