<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F2A33">
<title>Your visits · Bayou City Implant Center</title>
<meta name="robots" content="noindex,nofollow"><meta name="description" content="Private page for Bayou City Implant Center customers.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,400..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>:root{--slate:#1F2A33;--deck:#24313B;--raised:#2E3D48;--hivis:#6CC7D6;--text:#F4F7F8;--muted:#B7C3CB;--ok:#2BB673;--bad:#E8603F;--line:rgba(255,255,255,.12);--card:rgba(36,49,59,.9);--r:22px;--display:'Archivo',system-ui,sans-serif}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:#141E27;color:var(--text);font:400 18px/1.5 var(--display);-webkit-font-smoothing:antialiased;overflow-x:hidden}
#wall{position:fixed;inset:0;z-index:0;pointer-events:none;background-color:#141E27;background-image:radial-gradient(ellipse at 50% 30%,rgba(20,30,39,0) 40%,rgba(8,13,18,.55) 100%),url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22260%22 height=%22260%22 viewBox=%220 0 260 260%22%3E%3Cg transform=%22translate%2865 58%29 scale%281.6%29 translate%28-16 -16%29%22%3E%3Cpath d=%22M3 17 16 6l13 11%22 fill=%22none%22 stroke=%22%23FFD400%22 stroke-opacity=%22.26%22 stroke-width=%223.2%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M8 15v11h16V15%22 fill=%22none%22 stroke=%22%23fff%22 stroke-opacity=%22.12%22 stroke-width=%222.4%22 stroke-linejoin=%22round%22/%3E%3C/g%3E%3Ctext x=%2265%22 y=%2298%22 text-anchor=%22middle%22 font-family=%22Arial%2CHelvetica%2Csans-serif%22 font-weight=%22800%22 font-size=%2211%22 letter-spacing=%223%22 fill=%22%23fff%22 fill-opacity=%22.08%22%3ERIDGELINE%3C/text%3E%3Cg transform=%22translate%28195 188%29 scale%281.6%29 translate%28-16 -16%29%22%3E%3Cpath d=%22M3 17 16 6l13 11%22 fill=%22none%22 stroke=%22%23FFD400%22 stroke-opacity=%22.34%22 stroke-width=%223.2%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M8 15v11h16V15%22 fill=%22none%22 stroke=%22%23fff%22 stroke-opacity=%22.16%22 stroke-width=%222.4%22 stroke-linejoin=%22round%22/%3E%3C/g%3E%3Ctext x=%22195%22 y=%22228%22 text-anchor=%22middle%22 font-family=%22Arial%2CHelvetica%2Csans-serif%22 font-weight=%22800%22 font-size=%2211%22 letter-spacing=%223%22 fill=%22%23fff%22 fill-opacity=%22.11%22%3ERIDGELINE%3C/text%3E%3C/svg%3E");background-size:auto,260px 260px;background-position:center,center top}
#wall{animation:drift 90s linear infinite}
@keyframes drift{to{background-position:center,260px 520px}}
@media (max-width:640px){@keyframes drift{to{background-position:center,200px 400px}}}
#papp{position:relative;z-index:1}
a{color:inherit}button{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--hivis);outline-offset:3px;border-radius:10px}
svg{display:block}

/* ---------- language switch ---------- */
.plang{display:inline-flex;align-items:center;gap:4px;background:rgba(20,30,39,.75);border:1px solid var(--line);border-radius:999px;padding:4px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.plang-i{width:22px;height:22px;margin:0 2px 0 6px;color:var(--muted)}
.plang button{border:0;background:none;padding:9px 14px;min-height:44px;border-radius:999px;font-weight:700;font-size:16px;cursor:pointer;color:var(--muted);transition:background .2s,color .2s}
.plang button[aria-pressed="true"]{background:var(--hivis);color:var(--slate)}

/* ---------- PIN ---------- */
.pin{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px 28px;gap:18px;transition:opacity .45s,transform .5s cubic-bezier(.2,.8,.2,1)}
.pin.leave{opacity:0;transform:scale(1.06)}
.pin-top{position:absolute;top:16px;right:16px;left:16px;display:flex;justify-content:flex-end;gap:8px}
.pin-card{width:min(420px,100%);margin-top:56px;background:linear-gradient(180deg,rgba(46,61,72,.94),rgba(31,42,51,.96));border:1px solid var(--line);border-radius:28px;padding:26px 22px 22px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.97)}}
.pin-brand{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900;font-size:22px;letter-spacing:.02em;text-transform:uppercase}
.pin-brand .lg{width:38px;height:38px}.pin-brand small{display:block;font-size:11px;letter-spacing:.32em;color:var(--hivis);font-weight:800;text-align:left}
.lg-r,.lg-h{stroke-dasharray:60;stroke-dashoffset:60;animation:draw 1.1s .25s cubic-bezier(.6,0,.2,1) forwards}.lg-h{animation-delay:.6s}
@keyframes draw{to{stroke-dashoffset:0}}
.pin-lockwrap{width:74px;height:74px;margin:18px auto 6px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(255,212,0,.22),rgba(255,212,0,0) 70%);color:var(--hivis)}
.lock{width:46px;height:46px}.shackle{transform-origin:33px 22px;transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.pin-card.ok .shackle{transform:translateY(-5px) rotate(28deg)}
.pin-card.ok .pin-lockwrap{color:var(--ok);background:radial-gradient(circle,rgba(43,182,115,.3),rgba(43,182,115,0) 70%);animation:pop .5s}
@keyframes pop{50%{transform:scale(1.15)}}
.pin-kick{margin:6px 0 0;color:var(--hivis);font-weight:800;font-size:14px;letter-spacing:.14em;text-transform:uppercase}
.pin h1{font-size:clamp(25px,6.4vw,30px);line-height:1.15;margin:6px 0 6px;font-weight:850}
.pin-help{color:var(--muted);margin:0 auto 16px;max-width:30ch;font-size:17px}
.pin-dots{display:flex;justify-content:center;gap:16px;margin:4px 0 6px}
.pin-dots i{width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(244,247,248,.55);transition:transform .2s,background .2s,border-color .2s}
.pin-dots i.on{background:var(--hivis);border-color:var(--hivis);transform:scale(1.18)}
.pin-dots i.ok{background:var(--ok);border-color:var(--ok)}
.pin-card.shake{animation:shake .42s}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
.pin-in{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.pin-err{min-height:26px;margin:4px 0 6px;color:#FF9C85;font-weight:700;font-size:16px}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:4px}
.pt-key{position:relative;overflow:hidden;min-height:68px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(180deg,#34454F,#2A3943);font-size:30px;font-weight:750;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.35);transition:transform .08s,background .2s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;display:grid;place-items:center;text-decoration:none}
.pt-key:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.pt-key.hit::after{content:'';position:absolute;inset:0;margin:auto;width:20px;height:20px;border-radius:50%;background:rgba(255,212,0,.45);animation:ripple .45s ease-out forwards}
@keyframes ripple{to{transform:scale(9);opacity:0}}
.pt-txt{font-size:13px;font-weight:700;line-height:1.2;padding:6px;color:var(--muted);background:transparent;box-shadow:none;border-style:dashed}
.pt-del{font-size:26px;background:transparent;box-shadow:none}
.pin-site{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-weight:700;padding:12px 14px;min-height:48px}
.pin-site svg{width:20px;height:20px}
@media (hover:hover){.pt-key:hover{background:linear-gradient(180deg,#3B4D58,#2E3E49)}}

/* ---------- buttons ---------- */
.pbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:58px;padding:14px 22px;border-radius:16px;font-weight:800;font-size:18px;text-decoration:none;border:2px solid transparent;cursor:pointer;transition:transform .12s,filter .2s,background .2s;text-align:center;line-height:1.2}
.pbtn svg{width:22px;height:22px;flex:none}.pbtn:active{transform:scale(.98)}
.pbtn-main{background:var(--hivis);color:var(--slate);box-shadow:0 8px 24px rgba(255,212,0,.22)}
.pbtn-main:hover{filter:brightness(1.06)}
.pbtn-line{background:rgba(255,255,255,.04);border-color:rgba(244,247,248,.35);color:var(--text)}
.pbtn.sm{min-height:50px;font-size:16px;padding:10px 16px}
.prow{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.prow .pbtn{flex:1 1 220px}
.plink{display:inline-block;margin-top:12px;color:var(--text);font-weight:700;padding:8px 0}

/* ---------- portal shell ---------- */
.pwrap{max-width:680px;margin:0 auto;padding:0 16px 40px}
.ptop{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 0;margin:0 -16px;padding-left:16px;padding-right:16px;background:linear-gradient(180deg,rgba(20,30,39,.96),rgba(20,30,39,.82));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.pbrand{display:flex;align-items:center;gap:8px;font-weight:900;text-transform:uppercase;letter-spacing:.03em;text-decoration:none;font-size:19px;margin-right:auto}
.pbrand .lg{width:30px;height:30px}
.ptop .plang button{padding:7px 11px;min-height:40px;font-size:15px}.ptop .plang-i{display:none}
.plock{border:1px solid var(--line);background:none;border-radius:999px;padding:9px 14px;min-height:44px;font-weight:700;font-size:15px;color:var(--muted);cursor:pointer}
@media (max-width:420px){.pbrand span{display:none}}
.pmain{display:flex;flex-direction:column;gap:16px;padding-top:18px}
[data-anim]{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.8,.2,1),transform .6s cubic-bezier(.2,.8,.2,1);transition-delay:calc(min(var(--i,0),6) * 70ms)}
[data-anim].in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}[data-anim]{opacity:1;transform:none}}

.hello{display:flex;align-items:center;gap:16px;padding:6px 2px}
.hello h1{font-size:clamp(30px,8vw,40px);line-height:1.05;margin:0;font-weight:900;letter-spacing:-.01em}
.addr{margin:6px 0 0;color:var(--muted);font-size:17px}
.ring{position:relative;width:92px;height:92px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}.ring-bg{stroke:rgba(255,255,255,.1)}
.ring-fg{stroke:var(--hivis);stroke-linecap:round;stroke-dasharray:var(--c);stroke-dashoffset:var(--c);animation:fill 1.6s .3s cubic-bezier(.3,.8,.2,1) forwards;filter:drop-shadow(0 0 6px rgba(255,212,0,.5))}
@keyframes fill{to{stroke-dashoffset:var(--o)}}
.ring span{position:absolute;inset:0;display:grid;place-items:center}.ring span svg{width:40px;height:40px;transform:none}

.steps{list-style:none;margin:0;padding:14px 6px;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border:1px solid var(--line);border-radius:var(--r);position:relative}
.steps li{min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:clamp(10.5px,2.8vw,14px);letter-spacing:-.015em;hyphens:auto;color:var(--muted);font-weight:700;position:relative}
.steps li:not(:last-child)::after{content:'';position:absolute;top:15px;left:calc(50% + 18px);right:calc(-50% + 18px);height:3px;border-radius:3px;background:rgba(255,255,255,.14)}
.steps li.done:not(:last-child)::after{background:var(--hivis)}
.steps i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2)}
.steps i svg{width:18px;height:18px;color:var(--slate)}
.steps .done i{background:var(--hivis);border-color:var(--hivis)}
.steps .now i{border-color:var(--hivis);box-shadow:0 0 0 0 rgba(255,212,0,.6);animation:beat 1.8s infinite}
.steps .now i::after{content:'';width:12px;height:12px;border-radius:50%;background:var(--hivis)}
.steps .now span{color:var(--text)}
@keyframes beat{70%{box-shadow:0 0 0 12px rgba(255,212,0,0)}100%{box-shadow:0 0 0 0 rgba(255,212,0,0)}}

.pc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px;box-shadow:0 18px 50px rgba(0,0,0,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pc h2{font-size:25px;line-height:1.15;margin:0 0 4px;font-weight:850}
.pc h3{font-size:21px;line-height:1.2;margin:6px 0 8px;font-weight:800}
.pc p{margin:8px 0}
.pk{margin:0;color:var(--hivis);font-weight:800;font-size:13.5px;letter-spacing:.12em;text-transform:uppercase}
.pm{color:var(--muted)}.pm.sm,.sm{font-size:15px}
.pc-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:800;font-size:14.5px}
.pill svg{width:16px;height:16px}
.pill-ok,.pill-confirmed{background:rgba(43,182,115,.16);border-color:rgba(43,182,115,.5);color:#7FE0B0}
.pill-onway,.pill-arrived{background:rgba(255,212,0,.16);border-color:rgba(255,212,0,.55);color:var(--hivis)}
.dotlive{width:9px;height:9px;border-radius:50%;background:currentColor;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}

/* visit card */
.pc-visit{position:relative;overflow:hidden}
.pc-visit.live{border-color:rgba(255,212,0,.5);box-shadow:0 0 0 1px rgba(255,212,0,.25),0 22px 60px rgba(0,0,0,.4)}
.pc-visit::before{content:'';position:absolute;inset:-40% -20% auto auto;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,212,0,.13),transparent 65%);pointer-events:none}
.vbig{display:flex;gap:16px;align-items:center;margin:14px 0 6px}
.vcal{flex:none;width:86px;border-radius:18px;overflow:hidden;text-align:center;background:var(--text);color:var(--slate);box-shadow:0 10px 26px rgba(0,0,0,.35);transform-origin:top;animation:flip .8s .35s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes flip{from{transform:perspective(400px) rotateX(-80deg);opacity:0}}
.vcal small{display:block;background:var(--hivis);font-weight:900;text-transform:uppercase;letter-spacing:.1em;font-size:14px;padding:5px 0}
.vcal b{display:block;font-size:40px;line-height:1.05;font-weight:900;padding-top:4px}
.vcal span{display:block;font-size:14px;font-weight:700;padding-bottom:8px;text-transform:capitalize}
.vwhen{margin:2px 0;font-weight:700;text-transform:capitalize}
.vwin{margin:2px 0;font-size:20px;font-weight:800;color:var(--hivis)}
.vcount{display:inline-block;margin:6px 0 0;padding:4px 10px;border-radius:8px;background:rgba(255,255,255,.08);font-weight:800;font-size:15px}
.vlive{font-size:20px;font-weight:800;margin:6px 0 4px}
.route{position:relative;height:74px;margin:10px 0 2px}
.road{position:absolute;left:6px;right:52px;top:44px;height:8px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden}
.road i{position:absolute;inset:0;width:62%;background:linear-gradient(90deg,rgba(255,212,0,.15),var(--hivis));border-radius:8px;animation:go 2.4s cubic-bezier(.3,.6,.3,1) forwards}
.road.full i{width:100%;animation:none}
.road::after{content:'';position:absolute;inset:3px 0 auto;height:2px;background:repeating-linear-gradient(90deg,rgba(20,30,39,.7) 0 10px,transparent 10px 22px);animation:dash 1s linear infinite}
@keyframes go{from{width:0}}@keyframes dash{to{background-position:22px 0}}
.truck{position:absolute;top:8px;left:calc(62% - 60px);width:66px;animation:drive 2.4s cubic-bezier(.3,.6,.3,1) forwards,bob .5s ease-in-out infinite}
.truck.parked{left:auto;right:58px;animation:none}
@keyframes drive{from{left:-10px}}@keyframes bob{50%{transform:translateY(-2px)}}
.home{position:absolute;right:0;top:12px;width:50px;height:50px}
.home.pulse{border-radius:50%;animation:homeglow 1.6s infinite}
@keyframes homeglow{0%{box-shadow:0 0 0 0 rgba(255,212,0,.5)}100%{box-shadow:0 0 0 20px rgba(255,212,0,0)}}
.who{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.who h3{font-size:19px;margin:0 0 10px}
.crew{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:14px}
.crew li{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d) + .4s)}
.av{position:relative;width:96px;height:96px;border-radius:50%;padding:4px;border:0;cursor:zoom-in;background:conic-gradient(from 0deg,var(--hivis),#FFB000,rgba(255,212,0,.15),var(--hivis));animation:spin 6s linear infinite}
.av img,.av span{width:100%;height:100%;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:var(--raised);border:3px solid #24313B;font-size:34px;font-weight:900;animation:spin 6s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.crew b{font-size:17px;line-height:1.2;margin-top:4px}.crew small{color:var(--muted);font-size:14.5px}
.crew em{font-style:normal;color:var(--slate);background:var(--hivis);border-radius:999px;padding:2px 8px;font-weight:800;font-size:12.5px}
.teamph{margin:0 0 14px}.teamph button{padding:0;border:0;background:none;cursor:zoom-in;display:block;width:100%}
.teamph img{width:100%;max-height:340px;object-fit:cover;border-radius:18px;display:block;box-shadow:0 14px 36px rgba(0,0,0,.4)}
.teamph figcaption{display:flex;flex-direction:column;margin-top:8px}.teamph figcaption span{color:var(--muted)}
.whosoon{display:flex;gap:10px;align-items:flex-start}

/* to-do + change orders */
.todo{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:linear-gradient(90deg,rgba(255,212,0,.2),rgba(255,212,0,.06));border:1px solid rgba(255,212,0,.5);font-weight:800;font-size:19px}
.todo-n{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--hivis);color:var(--slate);font-size:21px;animation:pop 1s .8s}
.pc-co.waiting{border-color:rgba(255,212,0,.45)}
.pc-co.declined{opacity:.75}
.price{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:12px 0 2px;padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.2)}
.price small{color:var(--muted);font-size:15px}.price b{font-size:28px;font-weight:900;color:var(--text)}
.price.big{justify-content:flex-start}.price.big b{font-size:34px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:10px 0}
.pgrid button{padding:0;border:0;background:none;cursor:zoom-in;border-radius:12px;overflow:hidden;aspect-ratio:1}
.pgrid img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}.pgrid button:hover img{transform:scale(1.06)}
.opt{border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}.opt.on{border-color:var(--ok);background:rgba(43,182,115,.08)}
.opt-h{display:flex;justify-content:space-between;gap:10px;font-size:19px}.opt-h span{font-weight:900;color:var(--hivis)}
.opt ul,.mats{margin:8px 0 10px;padding-left:20px}.opt li{margin:3px 0}
.mats{list-style:none;padding:0}.mats li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.mats span{color:var(--muted)}
.xgrid{display:grid;gap:12px;margin-top:10px}
.x{display:flex;gap:14px;align-items:flex-start;padding:12px;border-radius:18px;background:rgba(0,0,0,.18);border:1px solid var(--line);transition:border-color .3s,background .3s}
.x.on{border-color:rgba(43,182,115,.55);background:rgba(43,182,115,.08)}
.x img{width:96px;height:96px;object-fit:cover;border-radius:14px;flex:none}
.x b{font-size:18.5px}.x p{margin:4px 0;color:var(--muted);font-size:16px}
.xp{display:block;font-size:22px;font-weight:900;margin:4px 0 8px}
.x .pill{margin-right:8px}.x .pbtn{margin-top:4px}
.tl{list-style:none;margin:10px 0 0;padding:0 0 0 18px;border-left:3px solid rgba(255,212,0,.35)}
.tl li{position:relative;padding:0 0 16px 6px}.tl li::before{content:'';position:absolute;left:-27px;top:5px;width:15px;height:15px;border-radius:50%;background:var(--hivis);border:3px solid #24313B}
.tl small{color:var(--muted);font-weight:700;text-transform:capitalize}.tl p{margin:2px 0}
.pc-warr{background:linear-gradient(135deg,rgba(43,182,115,.18),rgba(36,49,59,.9))}
.pc-more{display:grid;gap:10px;padding:12px}
.more{display:flex;flex-direction:column;padding:14px 16px;border-radius:16px;text-decoration:none;background:rgba(255,255,255,.04);border:1px solid var(--line);transition:background .2s,transform .2s}
.more:hover{background:rgba(255,212,0,.08);transform:translateX(4px)}
.more b{font-size:19px}.more b::after{content:' →';color:var(--hivis)}.more span{color:var(--muted);font-size:16px}

@media (min-width:560px){.pcontact{grid-template-columns:1fr 1fr}}
.pdemo{text-align:center;color:var(--muted);font-size:14px;margin:6px 0 0}

/* sheets */
.pscrim{position:fixed;inset:0;z-index:50;background:rgba(8,13,18,.72);display:flex;align-items:flex-end;justify-content:center;padding:12px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.psheet{width:min(560px,100%);max-height:92vh;overflow:auto;background:#24313B;border:1px solid var(--line);border-radius:24px;padding:22px 18px;animation:up .35s cubic-bezier(.2,.9,.3,1.1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (min-width:700px){.pscrim{align-items:center}}
.psheet h2{margin:0 0 8px;font-size:24px}
.pfield{display:flex;flex-direction:column;gap:6px;margin:14px 0 4px;font-weight:700}
.pfield input{font:inherit;font-size:20px;padding:14px;border-radius:14px;border:2px solid rgba(244,247,248,.35);background:#1A252E;color:var(--text);min-height:58px}
.pfield input:focus{border-color:var(--hivis);outline:none}
.sheet-x{display:flex;gap:14px;align-items:flex-start}.sheet-x img{width:110px;height:110px;object-fit:cover;border-radius:14px}

.ptoast{position:fixed;left:50%;bottom:24px;z-index:60;transform:translateX(-50%);background:var(--text);color:var(--slate);padding:14px 20px;border-radius:14px;font-weight:800;box-shadow:0 12px 30px rgba(0,0,0,.4);animation:up .3s;max-width:calc(100% - 32px);text-align:center}
.ptoast.out{opacity:0;transition:opacity .3s}

.again .pin-card,.again .lg-r,.again .lg-h,.again .vcal,.again .crew li,.again .ring-fg{animation:none!important;stroke-dashoffset:0}
.again .ring-fg{stroke-dashoffset:var(--o)}
.again [data-anim]{opacity:1;transform:none;transition:none}
.pin-card.busy .pin-dots i{animation:pdot .8s ease-in-out infinite alternate}.pin-card.busy .pin-dots i:nth-child(2){animation-delay:.15s}.pin-card.busy .pin-dots i:nth-child(3){animation-delay:.3s}.pin-card.busy .pin-dots i:nth-child(4){animation-delay:.45s}@keyframes pdot{to{opacity:.35;transform:scale(.8)}}
/* step-by-step progress (Oct 8) */
.psteps{list-style:none;margin:10px 0 0;padding:0;position:relative}
.psteps li{position:relative;display:flex;gap:14px;align-items:flex-start;padding:0 0 16px}
.psteps li:not(:last-child)::before{content:"";position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--line)}
.psteps li.done:not(:last-child)::before{background:var(--hivis)}
.pst-b{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;flex:none;border-radius:50%;border:2px solid var(--muted);color:var(--slate)}
.pst-b svg{width:18px;height:18px}
.psteps li.done .pst-b{background:var(--hivis);border-color:var(--hivis)}
.psteps li.now .pst-b{border-color:var(--hivis);box-shadow:0 0 0 6px rgba(255,212,0,.18);animation:pnow 1.6s ease-in-out infinite}
@keyframes pnow{50%{box-shadow:0 0 0 10px rgba(255,212,0,.06)}}
.psteps b{display:block;font-weight:800;line-height:1.3}.psteps li:not(.done):not(.now) b{color:var(--muted);font-weight:600}
.psteps small{display:block;color:var(--muted);font-size:15px}
.psteps li.now small{color:var(--hivis);font-weight:800}
@media (prefers-reduced-motion:reduce){.psteps li.now .pst-b{animation:none}}
/* the pay button (Oct 9): opens their QuickBooks / Square page */
.paybtn{position:relative;display:flex;align-items:center;gap:14px;margin:12px 0 6px;padding:16px 18px;border-radius:20px;text-decoration:none;color:#1F2A33;background:linear-gradient(135deg,#FFE45C,#6CC7D6 45%,#F2B800);box-shadow:0 10px 28px rgba(255,212,0,.32),inset 0 1px 0 rgba(255,255,255,.6);overflow:hidden;transition:transform .15s}
.paybtn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);animation:payshine 3.2s ease-in-out infinite}
@keyframes payshine{60%,100%{transform:translateX(120%)}}
.paybtn:active{transform:scale(.98)}
.paybtn-i{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;flex:none;border-radius:14px;background:rgba(31,42,51,.12)}.paybtn-i svg{width:28px;height:28px}
.paybtn-t{flex:1;min-width:0}.paybtn-t b{display:block;font:900 20px/1.2 var(--display)}.paybtn-t small{display:block;font-weight:700;opacity:.75}
.paybtn-a{font:900 28px/1 var(--display);transition:transform .2s}.paybtn:hover .paybtn-a{transform:translateX(4px)}
.paybtn-line{background:rgba(255,255,255,.06);color:var(--text);box-shadow:inset 0 0 0 1.5px var(--line)}.paybtn-line::after{display:none}.paybtn-line .paybtn-i{background:rgba(255,255,255,.08)}
.paid-big{display:flex;align-items:center;gap:10px;margin:8px 0;padding:14px 16px;border-radius:16px;background:rgba(43,182,115,.16);color:#7EE2B0}.paid-big svg{width:26px;height:26px}.paid-big b{font:900 19px/1.2 var(--display)}
@media (prefers-reduced-motion:reduce){.paybtn::after{animation:none}}

/* ---------- portal kinds (Oct 15): plan offer, rebook, event, policy, sample banner ---------- */
.psample{margin:0 0 4px;padding:10px 14px;border-radius:14px;background:rgba(255,212,0,.12);border:1px dashed rgba(255,212,0,.55);color:var(--text);font-size:15px}
.ppol{margin-top:8px}.ppol summary{cursor:pointer;color:var(--muted);font-weight:700;font-size:15px;min-height:44px;display:flex;align-items:center}
.pc-plan .plans{display:grid;gap:12px;margin-top:10px}
@media (min-width:640px){.pc-plan .plans{grid-template-columns:1fr 1fr}}
.plan{border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;background:rgba(20,30,39,.45)}
.plan.best{border-color:var(--hivis);box-shadow:0 0 0 1px var(--hivis) inset}

.plbonus{margin:12px 0 0;font-size:15px;color:var(--muted)}.plbonus b{color:var(--text)}
.pc-event h2{margin:4px 0 10px;font-size:26px}
.evdl{display:grid;gap:10px;margin:0 0 14px}.evdl div{display:grid;grid-template-columns:96px 1fr;gap:10px}.evdl dt{color:var(--muted);font-weight:700}.evdl dd{margin:0;font-weight:700}
.evpay{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px}.evpay li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px}
.evpay li b{font-size:20px}.evpay li small{grid-column:1/-1;color:var(--muted);display:flex;gap:6px;align-items:center}.evpay li small svg{width:16px;height:16px;color:var(--ok)}.evpay li.ok{border-color:rgba(43,182,115,.5)}
.pc-rebook p{margin:6px 0 12px}
.pdep{display:flex;align-items:center;gap:8px}.pdep-i svg{width:18px;height:18px;color:var(--ok)}

/* ---------- light theme (Oct 15, Ryan: lighter by default; dark stays as an option) ---------- */

[data-theme="light"] .todo{background:linear-gradient(90deg,color-mix(in srgb,var(--hivis) 22%,#fff),#fff)}

[data-theme="light"] .pc-visit::before{opacity:.5}

.pthm{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer}.pthm svg{width:20px;height:20px}

/* ---------- branded invoice ---------- */
.pinv{position:relative;background:#fff;color:#17222B;border-radius:18px;padding:22px 18px;border:1px solid rgba(23,34,43,.12);overflow:hidden;font-size:16px}
.pinv-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;padding-bottom:16px;border-bottom:3px solid var(--hivis)}
.pinv-brand{display:flex;gap:10px;align-items:flex-start}.pinv-brand .lg{width:40px;height:40px;flex:none}.pinv-brand .lg path:last-child{stroke:#17222B}
.pinv-brand b{display:block;font-size:18px}.pinv-brand small{display:block;color:#56636D;font-size:14px}
.pinv-t h2{margin:0 0 6px;font-size:24px;letter-spacing:.06em;text-transform:uppercase}
.pinv-t dl,.pinv-sum{margin:0;display:grid;gap:4px}.pinv-t dl div,.pinv-sum div{display:flex;justify-content:space-between;gap:16px}.pinv-t dt,.pinv-sum dt{color:#56636D}.pinv-t dd,.pinv-sum dd{margin:0;font-weight:700}
.pinv-to{margin:16px 0;display:grid;gap:2px}.pinv-to small{color:#56636D;text-transform:uppercase;letter-spacing:.08em;font-weight:800;font-size:12px}.pinv-to span{color:#56636D}
.pinv-tb{width:100%;border-collapse:collapse;margin:0 0 12px}.pinv-tb th{text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#56636D;padding:8px 0;border-bottom:1px solid rgba(23,34,43,.15)}
.pinv-tb th:last-child,.pinv-tb td:last-child{text-align:right;white-space:nowrap}.pinv-tb td{padding:10px 0;border-bottom:1px solid rgba(23,34,43,.08);vertical-align:top}
.pinv-sum{margin-left:auto;max-width:280px}.pinv-sum .tot{margin-top:6px;padding-top:8px;border-top:2px solid #17222B;font-size:20px}.pinv-sum .tot dt{color:#17222B;font-weight:800}
.pinv-note{margin:14px 0 0;color:#56636D;font-size:15px}.pinv-thx{margin:14px 0 0;font-weight:800}
.pinv-stamp{position:absolute;top:58%;right:-6px;transform:rotate(-14deg);border:4px solid #1E9E63;color:#1E9E63;font:900 34px/1 var(--display);letter-spacing:.12em;padding:6px 14px;border-radius:10px;opacity:.85}
.pinv-acts{margin-top:14px;flex-wrap:wrap}
@media print{body.printing-inv *{visibility:hidden!important}body.printing-inv #pinvDoc,body.printing-inv #pinvDoc *{visibility:visible!important}body.printing-inv #pinvDoc{position:fixed;inset:0;border:0;border-radius:0}}
/* ---------- thank-you screen ---------- */
.ty{min-height:100vh;min-height:100dvh;max-width:560px;margin:0 auto;padding:28px 16px 40px;display:grid;gap:16px;align-content:start}
.ty>.pthm{justify-self:center}
.ty-card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:28px 20px 22px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.12)}
.ty-card h1{margin:4px 0 6px;font-size:34px;line-height:1.1}.ty-p{margin:0;color:var(--muted)}
.ty-check{width:84px;height:84px;margin:0 auto 10px}.ty-check svg{width:100%;height:100%}.ty-check circle{fill:none;stroke:var(--ok);stroke-width:3;stroke-dasharray:151;stroke-dashoffset:151}.ty-check path{fill:none;stroke:var(--ok);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40}
.ty-card.go .ty-check circle{animation:tyc .5s ease-out forwards}.ty-card.go .ty-check path{animation:tyc .35s .45s ease-out forwards}@keyframes tyc{to{stroke-dashoffset:0}}
.ty-mail{display:flex;align-items:center;justify-content:center;gap:10px;margin:18px auto 4px;padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--ok) 12%,transparent);font-weight:700;font-size:15px;max-width:420px}
.ty-env{width:34px;height:24px;flex:none}.ty-env svg{width:100%;height:100%}.ty-env rect,.ty-env path{fill:none;stroke:var(--ok);stroke-width:2.4;stroke-linejoin:round}
.ty-card.go .ty-env{animation:tyenv .9s .7s cubic-bezier(.3,.7,.3,1) both}@keyframes tyenv{0%{transform:translate(-30px,6px) rotate(-12deg);opacity:0}60%{transform:translate(4px,-3px) rotate(4deg);opacity:1}100%{transform:none}}
.ty-card.still .ty-check circle,.ty-card.still .ty-check path{stroke-dashoffset:0}
.ty-h2{margin:20px 0 8px;font-size:18px;text-align:left}.ty-next{list-style:none;margin:0;padding:0;display:grid;gap:8px;text-align:left}.ty-next li{display:grid;grid-template-columns:22px 1fr;gap:10px}.ty-next svg{width:20px;height:20px;color:var(--ok);margin-top:2px}
.ty-cta{margin-top:18px;width:100%}
.ty-plan h2{margin:4px 0 8px;font-size:22px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}.ty-plan ul{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:7px}.ty-plan li{display:grid;grid-template-columns:20px 1fr;gap:8px}.ty-plan li svg{width:18px;height:18px;color:var(--ok);margin-top:3px}
.ty-ref p{margin:0 0 10px}
:root{--hivis:#6CC7D6;--sodium:#6CC7D6;--on-sodium:#10202B;--hi-ink:#335F66}#wall{display:none!important}/* ===== Customer portal: Framer / Notion look (Oct 16). Loaded after portal.css + theme. Light theme only; dark stays as before. =====
   Calm off-white canvas, white cards with hairlines, Inter, black primary buttons, brand color only for progress. */
:root[data-theme="light"]{--text:#191918;--muted:#6B6A66;--line:#EAEAE8;--card:#FFFFFF;--raised:#F4F4F2;--deck:#F8F8F7}
[data-theme="light"] body{background:#F8F8F7;font-family:"Inter",ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:17px;letter-spacing:-.006em}

[data-theme="light"] .pbrand span{display:inline;font:700 16px/1 "Inter Tight","Inter",sans-serif;letter-spacing:-.01em;color:var(--text)}

[data-theme="light"] .ring-bg{stroke:#ECECEA}
[data-theme="light"] .psample{background:#fff;border:1px dashed #DCDCD9;color:var(--muted);border-radius:12px}
/* step strip */
[data-theme="light"] .steps{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(15,15,15,.04)}
[data-theme="light"] .steps li{font-weight:600;color:#91908C}

[data-theme="light"] .steps i{background:#fff;border:1.5px solid #DCDCD9}

[data-theme="light"] .pk{font-weight:600;letter-spacing:.06em;color:#91908C;font-size:12.5px}

[data-theme="light"] .pc h3{font-weight:650}

[data-theme="light"] .psteps li:not(:last-child)::before{background:#ECECEA}

[data-theme="light"] .psteps li.done .pst-b svg{color:#fff}

[data-theme="light"] .vcal{border-radius:14px;border:1px solid var(--line);box-shadow:0 2px 8px rgba(15,15,15,.06)}

/* buttons */
[data-theme="light"] .pbtn{border-radius:12px;font-weight:600}
[data-theme="light"] .pbtn-main{background:#191918;color:#fff;border-color:#191918;box-shadow:0 1px 2px rgba(15,15,15,.2)}
[data-theme="light"] .pbtn-main:hover{filter:none;background:#000}
[data-theme="light"] .pbtn-line{background:#fff;border:1px solid #DCDCD9;color:var(--text)}
[data-theme="light"] .pbtn-line:hover{background:#F8F8F7}
[data-theme="light"] .paybtn{border-radius:14px}
/* "book again / website" links */
[data-theme="light"] .more{border-radius:12px;background:#F8F8F7;border:1px solid var(--line)}
[data-theme="light"] .more:hover{background:#F1F1EF;transform:none}
[data-theme="light"] .more b{font-weight:650}
[data-theme="light"] .more b::after{color:var(--text)}
/* PIN screen */
[data-theme="light"] .pin-card{border:1px solid var(--line);border-radius:22px;box-shadow:0 1px 2px rgba(15,15,15,.04),0 24px 60px -24px rgba(15,15,15,.18)}
[data-theme="light"] .pin-brand{text-transform:none;font-weight:700;letter-spacing:-.02em}
[data-theme="light"] .pin-brand small{color:#91908C;letter-spacing:.06em;font-weight:600}
[data-theme="light"] .pt-key{background:#fff;border:1px solid var(--line);box-shadow:0 1px 2px rgba(15,15,15,.05);font-weight:600}
@media (hover:hover){[data-theme="light"] .pt-key:hover{background:#F8F8F7}}
[data-theme="light"] .psheet{border-radius:20px 20px 0 0}
/* services: "what else we can do for you" (both themes) */
.pc-svcs .svh{margin:2px 0 4px}
.svgrid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}
.svc{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--deck)}
.svc b{font-size:17px;font-weight:650;letter-spacing:-.015em}
.svc p{margin:0;color:var(--muted);font-size:15px;line-height:1.45}
.svc-a{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:8px}
.svc-ask{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:10px;background:var(--text);color:var(--card);font-weight:600;font-size:15px;text-decoration:none}
.svc-ask svg{width:16px;height:16px}
.svc-more{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);font-weight:600;font-size:15px;text-decoration:none;color:var(--text);background:var(--card)}
.svc-more:hover,.svc-ask:hover{opacity:.88}
[data-theme="light"] .svc{background:#FBFBFA}
@media (min-width:640px){.svgrid{grid-template-columns:1fr 1fr}}
@media (min-width:980px){.pmain{max-width:760px}}
[data-theme="light"] #wall{display:none!important}
@media (max-width:519px){[data-theme="light"] .pbrand span{display:none}}
/* prepaid package card (Oct 21) */
.pc-pkg .pkrow{display:flex;align-items:center;gap:16px;margin-top:6px}
.pc-pkg h2{margin:0 0 4px}
.pkring{position:relative;width:72px;height:72px;flex-shrink:0}
.pkring svg{width:72px;height:72px;transform:rotate(-90deg)}
.pkring circle{fill:none;stroke-width:7}
.pkr-bg{stroke:var(--line)}
.pkr-fg{stroke:var(--text);stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.pkring b{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;font-weight:700;letter-spacing:-.02em}
.pkdots{list-style:none;display:flex;flex-wrap:wrap;gap:6px;padding:0;margin:16px 0 4px}
.pkdots li{width:22px;height:8px;border-radius:4px;background:var(--line)}
.pkdots li.on{background:var(--text)}
.pkact{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.pkbal{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--deck);border:1px solid var(--line)}
.pkbal span{color:var(--muted);font-size:15px}
.pkbal b{font-size:20px;margin-right:auto}
@media (prefers-reduced-motion:reduce){.pkr-fg{transition:none}}
/* truck moods (Oct 22) */
.scene{position:relative;height:96px;margin:12px 0 0;border-radius:14px;overflow:hidden;background:linear-gradient(180deg,var(--deck),var(--card))}
.sc-sleep{background:linear-gradient(180deg,#1E2A44 0%,#2E3D5C 100%)}
.sc-ground{position:absolute;left:0;right:0;bottom:0;height:14px;background:rgba(0,0,0,.08)}
.sc-sleep .sc-ground{background:#1A2338}
.sc-truck{position:absolute;left:50%;bottom:6px;width:120px;margin-left:-60px}
.tk{width:100%;height:auto;display:block;overflow:visible}
.tk-body{fill:#FFD400}.tk-cab{fill:#F4F4F2}.tk-win{fill:#2B3944}.tk-wh{fill:#1F2A33;stroke:#F4F4F2;stroke-width:2}.tk-hub{fill:#C9C8C4}
.tk-rack{fill:none;stroke:#C9C8C4;stroke-width:2.4;stroke-linecap:round}.tk-eye{fill:none;stroke:#1F2A33;stroke-width:2.2;stroke-linecap:round}.tk-lamp{fill:#FFF3B0}
.sc-sleep .sc-truck{animation:snore 3.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes snore{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.96) translateY(1px)}}
.sc-moon{position:absolute;top:12px;left:18px;width:22px;height:22px;fill:#F5E7A8}
.zz{position:absolute;left:calc(50% + 46px);bottom:58px;font:700 15px/1 "Inter Tight",Inter,sans-serif;color:#F4F4F2;opacity:0;animation:zz 3s ease-in infinite}
.z2{animation-delay:1s;font-size:18px}.z3{animation-delay:2s;font-size:22px}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(26px,-40px)}}
.sc-prep .sc-truck{animation:idle .35s ease-in-out infinite}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
.sc-wrench{position:absolute;left:calc(50% + 62px);bottom:44px;width:22px;height:22px;fill:none;stroke:var(--text);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;animation:wrench 1.1s ease-in-out infinite;transform-origin:20% 80%}
@keyframes wrench{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(25deg)}}
.sc-box{position:absolute;bottom:14px;width:16px;height:14px;border-radius:3px;background:#C9A26B;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.sc-box.b1{left:calc(50% - 98px);animation:load 2.4s ease-in-out infinite}
.sc-box.b2{left:calc(50% - 98px);animation:load 2.4s ease-in-out 1.2s infinite}
@keyframes load{0%{transform:translate(0,0);opacity:0}15%{opacity:1}60%{transform:translate(52px,-22px);opacity:1}75%,100%{transform:translate(52px,-22px);opacity:0}}
.sp{position:absolute;color:#E0B400;font-size:13px;animation:tw 1.6s ease-in-out infinite}
.sp.s1{left:calc(50% - 50px);top:16px}.sp.s2{left:calc(50% + 40px);top:10px;animation-delay:.8s}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}
.vmood{margin-top:10px}
@media (prefers-reduced-motion:reduce){.scene *{animation:none!important}.zz{opacity:1}.z1{transform:translate(4px,-6px)}.z2{transform:translate(14px,-18px)}.z3{transform:translate(24px,-30px)}.sc-box{opacity:0}}

.sc-box.b1,.sc-box.b2{left:calc(50% - 118px)}
.vmood{font-weight:500!important;font-size:16px!important;line-height:1.45!important;color:var(--text)}
.pinv-brand .lg-h{stroke:var(--text)!important}

  $('#sgGo').onclick=()=>{const n=$('#sgN').value.trim();if(n.length<3){$('#sgE').textContent=t.signErr;return}cl();done(n)}}
function ics(v){if(!v)return;const p=x=>String(x).padStart(2,'0'),f=ms=>{const d=new Date(ms);return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'T'+p(d.getHours())+p(d.getMinutes())+'00'};
  const a=at(v.date,v.from),b=v.to?at(v.date,v.to):a+36e5,txt=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Bayou City//Portal//EN','BEGIN:VEVENT','UID:'+v.id+'@ridgeline','DTSTAMP:'+f(Date.now()),'DTSTART:'+f(a),'DTEND:'+f(b),'SUMMARY:Bayou City Implant Center: '+(T().vt[v.type]||''),'LOCATION:'+(C.addr||'').replace(/,/g,'\\,'),'END:VEVENT','END:VCALENDAR'].join('\r\n');
  const u=URL.createObjectURL(new Blob([txt],{type:'text/calendar'})),l=document.createElement('a');l.href=u;l.download='ridgeline-visit.ics';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}

/* live refresh: when the owner changes something in another tab on this device, update without a reload */
addEventListener('storage',e=>{if(LIVE||e.key!=='kdentali-db'||!unlocked())return;try{const n=JSON.parse(e.newValue||'null');if(!n)return;DB=n;const c=(DB.customers||[]).find(x=>x.id===JOB);if(c){Object.keys(C).forEach(k=>delete C[k]);Object.assign(C,c);DB.customers[DB.customers.indexOf(c)]=C;portal()}}catch(x){}});
async function remoteAct(o,msg,party){const t=T();toast(t.sending);
  try{const r=await api(Object.assign({action:'portal_act'},o));if(r.ok){takeView(r);if(party)confetti();toast(msg);portal();return}
    if(r.reason==='pin'||r.reason==='locked'){try{sessionStorage.removeItem(KEY)}catch(x){}pinScreen();return}toast(t.err)}catch(x){toast(t.err)}}
/* customer's phone: pull fresh info every minute and when they come back to the page */
async function refresh(){if(!LIVE||document.hidden||!unlocked()||$('#player .psheet'))return;
  try{const r=await api({action:'portal_get'});if(r.ok){const was=JSON.stringify([C,DB.crew,DB.addons]);takeView(r);if(JSON.stringify([C,DB.crew,DB.addons])!==was)portal()}else if(r.reason==='pin'){try{sessionStorage.removeItem(KEY)}catch(x){}pinScreen()}}catch(x){}}
if(REMOTE){setInterval(refresh,60000);document.addEventListener('visibilitychange',refresh)}
const TY=new URLSearchParams(location.search).get('thanks');
if(TY)thanksScreen(TY);
else if(REMOTE&&JOB&&unlocked()&&PIN){$('#papp').innerHTML=`<main class="pin" id="pin"><section class="pin-card"><div class="pin-brand">${LOGO}<span>Bayou City<small>Implant dentistry</small></span></div><p class="pin-help">${T().loading}</p></section></main>`;
  api({action:'portal_get'}).then(r=>{if(r.ok){takeView(r);portal()}else if(r.reason==='nojob'&&LOCALC){C=LOCALC;portal()}else{try{sessionStorage.removeItem(KEY)}catch(x){}pinScreen()}}).catch(()=>{if(LOCALC){C=LOCALC;portal()}else pinScreen()})}
else if(DEMO||(C&&unlocked()&&!C.ph))portal();else pinScreen();
})();
</script></body></html>
