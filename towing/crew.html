function lview(DB,me){const p=me.perms||{},d0=new Date(Date.now()-864e5),d1=new Date(Date.now()+21*864e5),from=iso(d0),to=iso(d1),crew=DB.crew||[],out=[];

    const e=c.estimate,pick=e&&e.status==='approved'?e.opts[e.pick||0]:null;
    out.push({jid:c.id,vid:v.id,type:v.type,date:v.date,from:v.from,to:v.to,status:v.status||'scheduled',eta:v.eta||0,note:v.note||'',crew:(v.crew||[]).map(id=>crew.find(m=>m.id===id)).filter(Boolean).map(m=>({id:m.id,name:m.name,role:m.role,photo:m.photo})),
      name:c.name,addr:c.addr||'',phone:p.phone!==false?c.phone:'',email:p.phone!==false?(c.email||''):'',msg:c.msg||'',stage:c.stage,work:pick?{name:pick.name,items:pick.items}:null,
      changes:(j.changes||[]).filter(o=>o.status==='approved'||o.status==='paid').map(o=>o.title),mats:(c.matPlan||[]).map(m=>({desc:m.desc,qty:m.qty,unit:m.unit})),
      steps:(c.prod||{}).done||{},photos:p.photos!==false?(c.updates||[]).filter(u=>(u.photos||[]).length).slice(-6).map(u=>({t:u.t,text:u.text,by:u.by||'',photos:u.photos.slice(0,4)})):[]})})});
  out.sort((a,b)=>(a.date+a.from).localeCompare(b.date+b.from));return{ok:true,me:{id:me.id,name:me.name,role:me.role,photo:me.photo,perms:p},visits:out,demo:true}}
function local(o){const DB=ldb(),me=(DB.crew||[]).find(m=>m.code&&String(m.code)===String(o.code)&&m.active!==false);if(!me)return{ok:false,reason:'code'};
  const p=me.perms||{};if(o.action==='crew_get')return lview(DB,me);
  if(o.act==='selfie'){me.photo=o.photo;me.photoT=Date.now();lsave(DB);return lview(DB,me)}
  const c=(DB.customers||[]).find(x=>x.id===o.jid),v=c&&((c.job||{}).visits||[]).find(x=>x.id===o.vid);if(!v)return{ok:false,reason:'visit'};let msg='';
  if(o.act==='status'){if(p.status===false)return{ok:false,reason:'perm'};v.status=o.status;v.statusT=Date.now();v.by=me.name;if(o.eta)v.eta=o.eta;
    if(o.status==='done'&&v.type==='inspection'&&['lead','booked'].includes(c.stage))c.stage='inspected';if((o.status==='onway'||o.status==='arrived')&&v.type==='work'&&c.stage==='approved')c.stage='work';
    msg=`${me.name}: ${{confirmed:'confirmed',onway:'on the way',arrived:'arrived',done:'done for today'}[o.status]}`}
  else if(o.act==='photo'){if(p.photos===false)return{ok:false,reason:'perm'};c.updates=(c.updates||[]).concat([{t:Date.now(),text:o.text||'',photos:o.photos||[],by:me.name,crew:true}]);c.show=c.show||{};if(o.share)c.show.updates=true;msg=`${me.name} posted ${(o.photos||[]).length} photos`}
  else if(o.act==='step'){if(p.status===false)return{ok:false,reason:'perm'};c.prod=c.prod||{};c.prod.done=c.prod.done||{};if(o.undo){delete c.prod.done[o.k];msg=`${me.name} unchecked ${o.k}`}else{c.prod.done[o.k]={t:Date.now(),by:me.name};if((o.photos||[]).length){c.updates=(c.updates||[]).concat([{t:Date.now(),text:o.label||o.k,photos:o.photos,by:me.name,crew:true,step:o.k}]);c.show=c.show||{};c.show.updates=true}if(['arrived','tearoff'].includes(o.k)&&c.stage==='approved')c.stage='work';msg=`${me.name}: ${o.label||o.k} ✓`}}
  else if(o.act==='note'){c.crewNotes=(c.crewNotes||[]).concat([{t:Date.now(),by:me.name,text:o.text||''}]);msg=`${me.name} left a note`}
  c.fresh=true;DB.activity=(DB.activity||[]).concat([{t:Date.now(),cid:c.id,text:msg+' · '+c.name,seen:false}]).slice(-200);lsave(DB);return lview(DB,me)}
async function api(o){o=Object.assign({code:CODE},o);
  if(!REMOTE)return local(o);
  try{const r=await(await fetch(CFG.backend,{method:'POST',body:JSON.stringify(o)})).json();if(r.ok)return r;
    if(r.reason==='code'){const L=local(o);if(L.ok)return L}return r}
  catch(x){const L=local(o);if(L.ok)return L;return{ok:false,reason:'net'}}}

/* ---------- small UI helpers ---------- */
function toast(m){$$('.ctoast').forEach(x=>x.remove());const t=document.createElement('div');t.className='ctoast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.classList.add('out'),2600);setTimeout(()=>t.remove(),3100)}
function sheet(html){const L=$('#clayer');L.innerHTML=`<div class="cscrim"><div class="csheet" role="dialog" aria-modal="true">${html}</div></div>`;const prev=document.activeElement;
  const close=()=>{L.innerHTML='';document.removeEventListener('keydown',k);if(prev&&prev.focus)prev.focus()};const k=e=>{if(e.key==='Escape')close()};document.addEventListener('keydown',k);
  $('.cscrim',L).onclick=e=>{if(e.target.classList.contains('cscrim'))close()};$$('[data-close]',L).forEach(b=>b.onclick=close);const f=$('button,a,input',L);f&&f.focus();return close}
function readPhoto(file,max,q){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{let k=Math.min(1,max/Math.max(im.width,im.height)),u='';
  for(let i=0;i<4;i++){const cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);u=cv.toDataURL('image/jpeg',q);if(u.length<260000)break;k*=.75}ok(u)};im.src=r.result};r.readAsDataURL(file)})}
function faceCrop(file){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const s=Math.min(im.width,im.height),cv=document.createElement('canvas');cv.width=cv.height=360;
  cv.getContext('2d').drawImage(im,(im.width-s)/2,Math.max(0,(im.height-s)/2-s*.08),s,s,0,0,360,360);ok(cv.toDataURL('image/jpeg',.8))};im.src=r.result};r.readAsDataURL(file)})}
const maps=a=>{const e=encodeURIComponent(a),L=[['amaps',`https://maps.apple.com/?daddr=${e}`],['gmaps',`https://www.google.com/maps/dir/?api=1&destination=${e}`],['waze',`https://waze.com/ul?q=${e}&navigate=yes`]];return isApple?L:[L[1],L[0],L[2]]};

  $('#capp').innerHTML=`<main class="csign"><div class="csign-top"><button type="button" class="clang" id="cLang" hidden>${ic('globe')}${t.lang}</button></div>

    <p class="cerr" id="cErr" role="alert" ${msg?'':'hidden'}>${esc(msg||'')}</p>

    if(r.ok){S.set('ktowing-crew',c,$('#cKeep').checked);V=r;home()}else{CODE='';b.disabled=false;b.textContent=t.go;err.textContent=r.reason==='locked'?t.locked:r.reason==='net'?t.net:t.bad;err.hidden=false;i.select()}}}

  if(r.ok){V=r;if(ok)toast(ok);rerender();return true}if(r.reason==='code'){S.set('ktowing-crew','');signIn(T().bad);return}toast(T().fail);return false}

      ${v.mats.length?`<section class="ccard"><h3>${ic('truck')}${t.mats}</h3><p class="cmuted csm">${t.matsP}</p><ul class="cmats">${v.mats.map((m,i)=>`<li><label><input type="checkbox" data-mat="${i}" ${got[i]?'checked':''}><span><b>${esc(m.qty||'')} ${esc(m.unit||'')}</b> ${esc(m.desc||'')}</span></label></li>`).join('')}</ul></section>`:''}
      ${v.crew.length?`<section class="ccard"><h3>${ic('user')}${t.crew}</h3><ul class="ccrew">${v.crew.map(m=>`<li>${av(m,48)}<span><b>${esc(m.name)}</b><small>${esc(m.role||'')}</small></span></li>`).join('')}</ul></section>`:''}
      <section class="ccard"><h3>${ic('cam')}${t.photos}</h3>${p.photos!==false?`<label class="cb cb-main cb-wide">${ic('cam')}${t.addPh}<input type="file" accept="image/*" capture="environment" multiple id="phF" hidden></label>
        <div class="cthumbs" id="phTh"></div><div id="phMore" hidden><label class="cfield"><span>${t.caption}</span><input id="phT" maxlength="300"></label><label class="ctog"><input type="checkbox" id="phS" checked><span>${t.share}</span></label><button type="button" class="cb cb-go cb-wide" id="phGo">${ic('check')}${t.send}</button></div>
        ${v.photos.length?`<p class="csub">${t.recent}</p><div class="cthumbs">${v.photos.flatMap(u=>u.photos).slice(-8).map(u=>`<button type="button" class="cth" data-zoom="${esc(u)}"><img src="${esc(u)}" alt=""></button>`).join('')}</div>`:''}`:`<p class="cmuted">${t.photosOff}</p>`}</section>
      <section class="ccard"><h3>${ic('note')}${t.note}</h3><label class="cfield"><span class="sr">${t.note}</span><textarea id="nT" rows="3" placeholder="${t.noteP}"></textarea></label><button type="button" class="cb cb-line cb-wide" id="nGo">${t.send}</button></section>
      <a class="cb cb-line cb-wide" href="tel:${BIZ_PHONE}">${ic('phone')}${t.callOffice} · ${BIZ_PRETTY}</a>
    </main>`;
  scrollTo(0,y);bindCommon();bindSteps(v);$('#cBack').onclick=()=>{home();scrollTo(0,0)};
  $$('[data-mat]').forEach(c=>c.onchange=()=>{got[c.dataset.mat]=c.checked;try{localStorage.setItem(matKey,JSON.stringify(got))}catch(x){}});
  $$('[data-zoom]').forEach(b=>b.onclick=()=>sheet(`<img class="czoom" src="${esc(b.dataset.zoom)}" alt=""><button type="button" class="cb cb-line cb-wide" data-close>${t.cancel}</button>`));
  const pics=[];const f=$('#phF');if(f){f.onchange=async()=>{for(const x of [...f.files].slice(0,6-pics.length)){try{pics.push(await readPhoto(x,1280,.72))}catch(e){toast(t.tooBig)}}
      $('#phTh').innerHTML=pics.map(u=>`<span class="cth"><img src="${u}" alt=""></span>`).join('');$('#phMore').hidden=!pics.length;f.value=''};
    $('#phGo').onclick=()=>{if(!pics.length)return;act({act:'photo',jid:v.jid,vid:v.vid,photos:pics,text:$('#phT').value.trim(),share:$('#phS').checked},t.sent)}}
  $('#nGo').onclick=()=>{const x=$('#nT').value.trim();if(!x)return $('#nT').focus();act({act:'note',jid:v.jid,vid:v.vid,text:x},t.noteSent)}}

/* ---------- job steps (Oct 8): one tap = done; camera button = done + photo. Customer portal + owner + Slack update right away ---------- */
const CSTEPS=["dispatched", "arrived", "photos", "loaded", "delivered", "walkthrough"];
function stepsCard(v){const t=T(),p=V.me.perms||{};if(p.status===false||!(v.type==='work'||Object.keys(v.steps||{}).length))return'';const d=v.steps||{},nx=CSTEPS.find(k=>!d[k]);
  return `<section class="ccard csteps"><h3>${ic('check')}${t.steps}</h3><p class="cmuted csm">${t.stepsP}</p>
    ${nx?`<div class="cnext"><small>${t.nextUp}</small><div class="cgrid-n"><button type="button" class="cb cb-go cb-big" data-stp="${nx}">${ic('check')}${esc(t.sk[nx])}</button>${p.photos!==false?`<label class="cb cb-line cb-cam" aria-label="${t.withPhoto}: ${esc(t.sk[nx])}">${ic('cam')}<input type="file" accept="image/*" capture="environment" data-stpc="${nx}" hidden></label>`:''}</div></div>`:`<p class="cdone">${ic('check')}${t.allDone}</p>`}
    <ul class="cstl">${CSTEPS.map(k=>`<li class="${d[k]?'done':''}"><button type="button" data-stp="${k}" ${d[k]?'data-undo="1"':''} aria-pressed="${!!d[k]}"><span class="cst-b">${ic('check')}</span><span><b>${esc(t.sk[k])}</b>${d[k]?`<small>${new Date(d[k].t).toLocaleTimeString(LOC(),{hour:'numeric',minute:'2-digit'})} · ${esc(d[k].by||'')}</small>`:''}</span></button>${!d[k]&&p.photos!==false?`<label class="cst-cam" aria-label="${t.withPhoto}">${ic('cam')}<input type="file" accept="image/*" capture="environment" data-stpc="${k}" hidden></label>`:''}</li>`).join('')}</ul></section>`}
function bindSteps(v){const t=T();
  $$('[data-stp]').forEach(b=>b.onclick=()=>{const k=b.dataset.stp,undo=!!b.dataset.undo;act({act:'step',jid:v.jid,vid:v.vid,k,label:t.sk[k],undo},undo?t.unchecked:'✓ '+t.sk[k])});
  $$('[data-stpc]').forEach(i=>i.onchange=async()=>{const f=i.files[0];if(!f)return;const k=i.dataset.stpc;try{const u=await readPhoto(f,1280,.72);act({act:'step',jid:v.jid,vid:v.vid,k,label:t.sk[k],photos:[u]},'✓ '+t.sk[k])}catch(x){toast(t.tooBig)}})}

/* ---------- start + stay fresh ---------- */
async function reload(manual){if(!CODE)return;if(!manual&&($('#clayer .csheet')||busy||document.hidden))return;
  if(!manual&&document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
  const r=await api({action:'crew_get'});if(r.ok){const was=JSON.stringify(V);V=r;if(manual||JSON.stringify(V)!==was)rerender();if(manual)toast(T().updated)}else if(r.reason==='code'){S.set('ktowing-crew','');signIn(T().bad)}else if(manual)toast(T().net)}
setInterval(reload,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)reload()});
addEventListener('storage',e=>{if(e.key==='ktowing-db'&&V&&V.demo)reload()});
if(CODE){$('#capp').innerHTML=`<main class="csign"><div class="ccard csign-card"><div class="cbrand">${LOGO}<span>Hook & Haul<small>${T().title}</small></span></div><p class="cmuted">${T().busy}</p></div></main>`;
  api({action:'crew_get'}).then(r=>{if(r.ok){V=r;home()}else{if(r.reason==='code')S.set('ktowing-crew','');signIn(r.reason==='net'?T().net:'')}})}
else signIn();
})();
</script></body></html>
